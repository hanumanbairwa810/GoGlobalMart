<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitemap | GoGlobal Mart</title>
<meta name="description" content="Browse every public page of GoGlobal Mart: shopping, order tracking, policies and support, all in one place.">
<link rel="canonical" href="https://goglobalmart.me/sitemap.html">
<link rel="icon" type="image/png" sizez="32*32" href="fevicon.png">
<link rel="shortcut icon" href="/fevicon.png">
<link rel="apple-touch-icon" href="/fevicon.png">
<meta name="robots" content="index, follow">
<style>
:root{
  --bg:#141414; --bg2:#1d1d1d; --ivory:#faf7f0; --ink:#1b1b1b; --muted:#6b665c;
  --gold:#c9a24b; --gold-d:#9a7a2e; --line:rgba(201,162,75,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ivory);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
a{color:inherit}
header.hero{padding:64px 20px 40px;text-align:center;border-bottom:1px solid var(--line);
  background:radial-gradient(ellipse at top,#262014 0,var(--bg) 70%)}
.brand{letter-spacing:.3em;text-transform:uppercase;font-size:.75rem;color:var(--gold)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(2rem,6vw,3.2rem);margin:.4rem 0}
.hero p{max-width:560px;margin:0 auto;color:#cfc9bb}
.rule{width:64px;height:2px;background:var(--gold);margin:18px auto 0}
main{max-width:1100px;margin:0 auto;padding:40px 20px 64px}
.search{display:block;width:100%;max-width:420px;margin:0 auto 36px;padding:12px 16px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg2);color:var(--ivory);font-size:1rem}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--ivory);color:var(--ink);border-radius:14px;padding:24px;
  border-top:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.35);
  animation:rise .5s ease both}
.card h2{font-family:Georgia,serif;font-weight:400;font-size:1.25rem;margin:0 0 4px}
.card .sub{margin:0 0 14px;font-size:.85rem;color:var(--muted)}
.card ul{list-style:none;margin:0;padding:0}
.card li{border-top:1px solid #e6dfcd}
.card li a{display:block;padding:10px 4px;text-decoration:none;color:var(--ink)}
.card li a:hover{color:var(--gold-d);padding-left:10px;transition:.2s}
.card li small{display:block;color:var(--muted);font-size:.8rem}
a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.empty{display:none;text-align:center;color:#cfc9bb;margin-top:24px}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;color:#a39d8f;font-size:.85rem}
footer a{color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="brand">GoGlobal Mart</div>
  <h1>Sitemap</h1>
  <p>Every public page on GoGlobal Mart, organised so you can find what you need quickly.</p>
  <div class="rule"></div>
</header>

<main>
  <label for="q" class="sr" style="position:absolute;left:-9999px">Filter pages</label>
  <input id="q" class="search" type="search" placeholder="Filter pages…" autocomplete="off">
  <div id="grid" class="grid"></div>
  <p id="none" class="empty">No matching pages.</p>
</main>

<footer>
  <a href="/index.html">Home</a> · <a href="/privacy-policy.html">Privacy Policy</a> · <a href="/terms-service.html">Terms of Service</a> ·
  <a href="/contact.html">Contact Us</a><br>
  © 2025 GoGlobal Mart. Affiliate Disclosure: we earn from qualifying purchases.
</footer>

<script>
/*
  SITEMAP DATA
  Only routes verified on https://goglobalmart.me/ are listed.
  Sections with an empty list are hidden automatically.
  When a page goes live (About, FAQ, Blog, Mini Store, Food Restro…),
  add it to the matching section below.
*/
const SECTIONS = [
  { title:"Main Website", sub:"Start here", links:[
    { name:"Home", href:"/", note:"Deals from Amazon, Flipkart, Meesho & Myntra" },
    { name:"Contact Us", href:"/contact.html" }
  ]},
  { title:"Affiliate Shopping", sub:"Product discovery and deals", links:[
    { name:"Trending Deals", href:"/#trending" },
    { name:"Under ₹500", href:"/#under500" },
    { name:"Fashion", href:"/fashions.html" }
  ]},
  { title:"Mini Store", sub:"Direct store", links:[
    /* { name:"Mini Store", href:"/mini-store.html" } */
  ]},
  { title:"Food Restro", sub:"Food and restaurants", links:[
    /* { name:"Food Restro", href:"/food.html" } */
  ]},
  { title:"Company and Editorial", sub:"About the team", links:[
    /* { name:"About Us", href:"/about.html" }, { name:"Careers", href:"/careers.html" }, { name:"Blog", href:"/blog.html" } */
  ]},
  { title:"Policies and Support", sub:"Help and legal", links:[
    { name:"Track Order", href:"/track-order.html" },
    { name:"Privacy Policy", href:"/privacy-policy.html" },
    { name:"Terms of Service", href:"/terms-service.html" },
    { name:"Affiliate Disclosure", href:"/affiliate-disclosure.html" }
  ]}
];

const grid = document.getElementById("grid");
const none = document.getElementById("none");
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(filter=""){
  const f = filter.trim().toLowerCase();
  let html = "", shown = 0;
  SECTIONS.forEach((s,i)=>{
    const items = s.links.filter(l => !f || (l.name+" "+(l.note||"")).toLowerCase().includes(f));
    if(!items.length) return;
    shown++;
    html += `<section class="card" style="animation-delay:${i*60}ms" aria-labelledby="h${i}">
      <h2 id="h${i}">${esc(s.title)}</h2><p class="sub">${esc(s.sub)}</p><ul>` +
      items.map(l=>`<li><a href="${esc(l.href)}">${esc(l.name)}${l.note?`<small>${esc(l.note)}</small>`:""}</a></li>`).join("") +
      `</ul></section>`;
  });
  grid.innerHTML = html;
  none.style.display = shown ? "none" : "block";
}
document.getElementById("q").addEventListener("input", e => render(e.target.value));
render();
</script>
</body>
</html>
